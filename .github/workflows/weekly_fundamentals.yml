name: Weekly Fundamental Metrics Sync

on:
  schedule:
    # 02:00 AM IST on Sunday is 20:30 UTC on Saturday
    - cron: '30 20 * * 6'
  workflow_dispatch:
    inputs:
      force_refresh:
        description: 'Force full re-fetch of all 501 symbols'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: "mits-pro-weekly-fundamentals"
  cancel-in-progress: true

jobs:
  sync-fundamentals:
    name: Sync Real Fundamentals & Quarters
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Fundamental Sync Engine
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event.inputs.force_refresh }}" = "true" ] || [ -z "${{ github.event.inputs.force_refresh }}" ]; then
            python scripts/sync_fundamentals.py --force
          else
            python scripts/sync_fundamentals.py
          fi

      - name: Commit and Push Updated Fundamentals
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true
          git add data/fundamentals.json
          if git diff --staged --quiet; then
            echo "No changes detected in fundamentals.json"
          else
            git commit -m "Auto-sync: Weekly Fundamental Metrics Update [skip ci]"
            git push origin main
          fi
