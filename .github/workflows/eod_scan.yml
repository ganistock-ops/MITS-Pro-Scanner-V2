name: MITS Pro Institutional EOD Scanner

on:
  schedule:
    # 4:15 PM IST is 10:45 UTC (Monday to Friday trading days)
    - cron: '45 10 * * 1-5'
  workflow_dispatch:
    inputs:
      force_scan:
        description: 'Force quantitative market rescan'
        required: false
        default: 'true'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "mits-pro-eod-scanner"
  cancel-in-progress: true

jobs:
  run-eod-scan:
    name: Execute EOD Pipeline & Publish Feeds
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute MITS Pro Scanner Pipeline
        run: |
          python scripts/run_pipeline.py
          if [ ! -f data/master_universe_eod.json ]; then
            echo "master_universe_eod.json not found, running standalone exporter..."
            python scripts/master_universe_exporter.py
          fi

      - name: Verify Feeds Integrity
        run: |
          test -f data/scanner_results.json || (echo "ERROR: Missing data/scanner_results.json" && exit 1)
          test -f data/master_universe_eod.json || (echo "ERROR: Missing data/master_universe_eod.json" && exit 1)
          test -f data/adv_scanner_1_rs.json || (echo "ERROR: Missing data/adv_scanner_1_rs.json" && exit 1)
          test -f data/adv_scanner_2_early_bo.json || (echo "ERROR: Missing data/adv_scanner_2_early_bo.json" && exit 1)
          test -f data/adv_scanner_3_momentum_continuation.json || (echo "ERROR: Missing data/adv_scanner_3_momentum_continuation.json" && exit 1)
          test -f data/adv_scanner_4_rbr_proportional.json || (echo "ERROR: Missing data/adv_scanner_4_rbr_proportional.json" && exit 1)
          test -f data/adv_scanner_5_confluence_engine.json || (echo "ERROR: Missing data/adv_scanner_5_confluence_engine.json" && exit 1)
          echo "Feed integrity verified: scanner_results.json, master_universe_eod.json, adv_scanner_1_rs.json, adv_scanner_2_early_bo.json, adv_scanner_3_momentum_continuation.json, adv_scanner_4_rbr_proportional.json, and adv_scanner_5_confluence_engine.json exist."

      - name: Commit and Push Updated Data Feeds
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A data/
          git diff-index --quiet HEAD || git commit -m "Auto-update EOD Pro & Custom Scanner Datasets [skip ci]"
          git pull --rebase origin main
          git push origin main
